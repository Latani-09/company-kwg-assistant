databases:
  - name: kwg-db
    plan: free
    databaseName: kwg_assistant
    user: kwg

services:
  - name: kwg-backend
    type: web
    runtime: python
    plan: free
    rootDir: python-backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kwg-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: RAG_SIMILARITY_FLOOR
        value: "0.55"
      - key: RAG_TOP_K
        value: "5"
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: apikey
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        value: https://kwg-frontend.onrender.com

  - name: kwg-frontend
    type: web
    runtime: static
    rootDir: react-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kwg-backend.onrender.com/api/v1
      - key: NODE_VERSION
        value: 20.20.2
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
