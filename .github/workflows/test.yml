name: Test Suites

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kwg
          POSTGRES_PASSWORD: kwg
          POSTGRES_DB: kwg_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwg -d kwg_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: python-backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kwg:kwg@localhost:5432/kwg_assistant_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: python-backend/coverage.xml
      - name: Comment backend coverage on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('python-backend/coverage.xml', 'utf8');
            const match = report.match(/line-rate="([0-9.]+)"/);
            const percent = match ? (Number(match[1]) * 100).toFixed(1) : 'unknown';
            const marker = '<!-- backend-coverage -->';
            const body = `${marker}\n## Backend coverage\nLine coverage: **${percent}%**\n\nGenerated by the test workflow.`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: react-app/.nvmrc
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests with coverage
        run: npm test -- --run --coverage
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: react-app/coverage
      - name: Comment frontend coverage on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('react-app/coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const marker = '<!-- frontend-coverage -->';
            const body = `${marker}\n## Frontend coverage\nStatements: **${total.statements.pct}%** | Branches: **${total.branches.pct}%** | Functions: **${total.functions.pct}%** | Lines: **${total.lines.pct}%**\n\nGenerated by the test workflow.`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
